<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دورة  CSS</title>

<style>
    .box {
        height: 400px;
        width: 400px;
        border: 10px solid black;
        margin: 25px auto;
    }
    .box1, .box2 {
        height: 150px;
        width: 150px;
    }
    .box1 {
        background-color: #ff0000;
        position: relative;
        top: 50px;
    }
    .box2 {
        background-color: #009999;
    }
   
</style>
</head>
<body>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>

   
</body>

</html>
